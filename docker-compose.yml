networks:
  ecobot_net:
    driver: bridge

services:
  redis:
    image: redis:alpine
    restart: always
    networks: [ecobot_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    build: ./db_custom
    restart: always
    env_file: ./db_custom/.env
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
      - ./db_custom/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks: [ecobot_net]
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-eco}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./salut_bot
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./salut_bot/.env
      - ./shared.env
    volumes:
      - ./maps:/app/maps
      - ./salut_bot/images:/app/images
      - ./salut_bot/faq:/app/faq
      - ./salut_bot/embedding_models:/app/embedding_models
      - ./salut_bot/knowledge_base_scripts/Vector/faiss_index:/app/knowledge_base_scripts/Vector/faiss_index
      - ./logs:/app/logs
      - ./shared.env:/app/shared.env:ro
      - ./salut_bot/search_api/services/geo_map_service.py:/app/search_api/services/geo_map_service.py:ro
      - ./EcoBotProject/DialogService/prompts:/app/prompts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DB_HOST=db
      - REDIS_HOST=redis
      - RAG_ORCHESTRATOR_URL=http://rag-orchestrator:8000
      - FAQ_PATH=/app/faq/faq.json
      - BASE_PATH=${BASE_PATH:-/ecoassistant}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ecobot_net]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - ecobot_net
    restart: always

  rag-orchestrator:
    build:
      context: ./rag-orchestrator
      dockerfile: Dockerfile
    env_file:
      - ./shared.env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_MODELS_BASE_DIR=/app/embedding_models
      - EMBEDDING_MODEL=bge-m3
    volumes:
      - ./salut_bot/embedding_models:/app/embedding_models:ro
      - ./data/rag_state:/app/state
    depends_on:
      - db
      - qdrant
    networks:
      - ecobot_net
    restart: always
    ports:
      - "8000:8000"

  core-api:
    build: ./EcoBotProject/DialogService
    restart: always
    env_file:
      - ./EcoBotProject/DialogService/.env
      - ./shared.env
    volumes:
      - ./shared.env:/app/shared.env:ro
      - ./EcoBotProject/DialogService/prompts:/app/prompts
    command: python api.py
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - DB_HOST=db
      - ECOBOT_API_BASE_URL=http://backend:8000
      - BASE_PATH=${BASE_PATH:-/ecoassistant}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [ecobot_net]

  max:
    build: ./EcoBotProject/DialogService
    restart: always
    env_file:
      - ./EcoBotProject/DialogService/.env
      - ./shared.env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./shared.env:/app/shared.env:ro
      - ./EcoBotProject/DialogService/adapters/max/presenter.py:/app/adapters/max/presenter.py:ro
      - ./EcoBotProject/DialogService/prompts:/app/prompts:ro
    command: python main_max.py
    expose:
      - "8080"
    ports:
      - "8080:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_HOST=redis
      - MAX_USE_WEBHOOK=true
      - MAX_WEBHOOK_PORT=8080
      - MAX_WEBHOOK_PATH=/max-webhook
      - BASE_PATH=${BASE_PATH:-/ecoassistant}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - core-api
    networks: [ecobot_net]

  admin:
    build: ./AdminPanel
    restart: always
    env_file:
      - ./AdminPanel/.env
      - ./shared.env
    volumes:
      - ./data/admin_db:/app/admin_db
      - ./shared.env:/app/shared.env
      - ./AdminPanel/.env:/app/.env
      - ./AdminPanel/templates:/app/templates
      - ./AdminPanel/static:/app/static
      - ./AdminPanel:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - ANNOTATOR_URL=http://annotator:8010
      - BASE_PATH=${BASE_PATH:-/ecoassistant}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks: [ecobot_net]

  annotator:
    build: ./annotator
    profiles: [annotator]
    restart: always
    env_file:
      - path: ./annotator/.env
        required: false
    volumes:
      - ./annotator/models:/app/models
    expose:
      - "8010"
    networks: [ecobot_net]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /dev/null:/etc/nginx/conf.d/default.conf
      - ./maps:/var/www/maps
      - ./salut_bot/images:/var/www/images
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - admin
      - core-api
    networks: [ecobot_net]

  dsapi:
    build:
      context: ./dsapi
    # Выключен 20.11.2026: dsapi в проекте не используется (моделей нет, Ollama нет).
    # Профиль не даёт ему стартовать при обычном "docker compose up -d".
    # Включить вручную: docker compose --profile dsapi up -d dsapi
    profiles: [dsapi]
    env_file:
      - ./dsapi/.env
    expose:
      - "5050"
    volumes:
      - ./dsapi/local_models:/app/local_models
      - ./dsapi/doc:/app/doc:ro
      - ./dsapi/prompts_structure:/app/prompts_structure:ro
      - ./dsapi/logs:/app/logs
      - ./dsapi/results:/app/results
    restart: unless-stopped
    networks: [ecobot_net]

  images-extractor:
    build:
      context: ./images-extractor
    profiles: [extractor]
    env_file:
      - ./images-extractor/.env
    environment:
      YOLO_CONFIG_DIR: /tmp
      HF_HOME: /app/.cache/huggingface
      TORCH_HOME: /app/.cache/torch
    volumes:
      - ./images-extractor/objects:/app/objects
      - ./images-extractor/data:/app/data
      - ./images-extractor/photos:/app/photos
      - ./images-extractor/results:/app/results
      - ./images-extractor/cache:/app/.cache
      - ./images-extractor/SAM:/app/SAM
      - ./images-extractor/ViT:/app/ViT
      - ./images-extractor/local_bioclip_model:/app/local_bioclip_model
      - ./images-extractor/local_blip_model:/app/local_blip_model
      - ./images-extractor/local_grounding_dino_tiny_model:/app/local_grounding_dino_tiny_model
      - ./images-extractor/local_owlv2_model:/app/local_owlv2_model
    restart: "no"
    networks: [ecobot_net]

  stt-service:
    build:
      context: ./stt_service
    image: ecobot/stt-service:latest
    container_name: stt-service
    restart: unless-stopped
    environment:
      STT_MODEL_SIZE: small
      STT_LANGUAGE: ru
      STT_WORDS_FILE: /app/data/words.txt
      STT_MODEL_CACHE_DIR: /models/whisper
      HF_HOME: /models/huggingface
      PYTHONUNBUFFERED: "1"
    volumes:
      - stt_models:/models
      - ./stt_service/words.txt:/app/data/words.txt:ro
    ports:
      - "0.0.0.0:8082:8081"
    expose:
      - "8081"
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [ecobot_net]

  # Тесты работоспособности всего стека. В `up -d` не участвует (профиль health).
  # Запуск: bash scripts/healthcheck.sh   (подробно — tests/health/README.md)
  health-tests:
    build: ./tests/health
    profiles: [health]
    restart: "no"
    env_file:
      - path: ./tests/health/health.env
        required: false
    volumes:
      # Docker API: читать окружение/логи контейнеров и выполнять пробы внутри них
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tests/health:/tests:ro
      - ./logs:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [ecobot_net]

volumes:
  stt_models:
