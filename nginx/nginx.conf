events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # 1. Если браузер пришёл на задвоенный /ecoassistant/ecoassistant/... — мгновенно исправляем URL
        if ($request_uri ~ ^/ecoassistant/ecoassistant/(.*)$) {
            return 302 /ecoassistant/$1;
        }

        # 2. Если запрос пришёл с нерезаным /ecoassistant/... — срезаем его внутри Nginx для единой маршрутизации
        rewrite ^/ecoassistant/?(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header X-Forwarded-Prefix /ecoassistant;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cookie сессии доступны на любом пути (чтобы сессия логина не терялась между /admin и /ecoassistant/admin)
        proxy_cookie_path / /;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /maps/ {
            alias /var/www/maps/;
            open_file_cache off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            autoindex off;
        }

        location /images/ {
            alias /var/www/images/;
            autoindex off;
        }

        location /search/ {
            proxy_pass http://backend:8000/;
        }

        location /core-api/ {
            proxy_pass http://core-api:5001/;
        }

        location /admin/static/ {
            proxy_pass http://admin:8000;
        }

        location = /admin {
            rewrite ^/admin$ / break;
            proxy_pass http://admin:8000;
            proxy_redirect off;
        }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://admin:8000;
            proxy_redirect off;
            client_max_body_size 50M;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location / {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 180s;
        }
    }
}
