events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr notice;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_x_forwarded_proto $real_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # --- Docker DNS (добавлено 2026-11-20) ---
        # Без этого nginx один раз узнаёт IP контейнеров при своём старте. После пересоздания
        # контейнеров (docker compose up --force-recreate / restart) IP меняются, и nginx шлёт
        # запросы на старые адреса -> 502/404 (так сломалось 20.11). 127.0.0.11 - встроенный DNS
        # Docker; valid=10s - nginx заново узнаёт адреса каждые 10 секунд.
        # resolver работает, только если proxy_pass задан через переменную, поэтому ниже имена
        # сервисов вынесены в $up_*. set стоят ДО rewrite ... break, иначе break их пропустит.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $up_backend  backend:8000;
        set $up_core_api core-api:5001;
        set $up_admin    admin:8000;

        # 1. Если браузер пришёл на задвоенный /ecoassistant/ecoassistant/... — мгновенно исправляем URL
        if ($request_uri ~ ^/ecoassistant/ecoassistant/(.*)$) {
            return 302 /ecoassistant/$1;
        }

        # 2. Если запрос пришёл с нерезаным /ecoassistant/... — срезаем его внутри Nginx для единой маршрутизации
        rewrite ^/ecoassistant/?(.*)$ /$1 break;

        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header X-Forwarded-Prefix /ecoassistant;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cookie сессии доступны на любом пути (чтобы сессия логина не терялась между /admin и /ecoassistant/admin)
        proxy_cookie_path / /;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /maps/ {
            alias /var/www/maps/;
            open_file_cache off;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            autoindex off;
        }

        location /images/ {
            alias /var/www/images/;
            autoindex off;
        }

        location /search/ {
            # с переменной в proxy_pass nginx сам не срезает префикс location - режем rewrite'ом
            rewrite ^/search/(.*)$ /$1 break;
            proxy_pass http://$up_backend;
        }

        location /core-api/ {
            # с переменной в proxy_pass nginx сам не срезает префикс location - режем rewrite'ом
            rewrite ^/core-api/(.*)$ /$1 break;
            proxy_pass http://$up_core_api;
        }

        location /admin/static/ {
            proxy_pass http://$up_admin;
        }

        location = /admin {
            rewrite ^/admin$ / break;
            proxy_pass http://$up_admin;
            proxy_redirect off;
        }

        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://$up_admin;
            proxy_redirect off;
            client_max_body_size 50M;
            proxy_read_timeout 180s;
            proxy_send_timeout 180s;
        }

        location /ingest {
            proxy_pass http://rag-orchestrator:8000/ingest;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
	location = /max-webhook {
            proxy_pass http://max:8080/max-webhook;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $real_scheme;
        }

        location / {
            proxy_pass http://$up_backend;
            proxy_read_timeout 180s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
